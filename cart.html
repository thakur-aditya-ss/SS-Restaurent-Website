<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | SS Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="./index.html">
          <img src="./assets/SNS Restaurant logo.png" alt="SS Restaurant" width="40" class="me-2">
          SS Restaurant
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a href="./index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="./about.html" class="nav-link">About</a></li>
            <li class="nav-item"><a href="./menu.html" class="nav-link">Menu</a></li>
            <li class="nav-item"><a href="./events.html" class="nav-link">Events</a></li>
            <li class="nav-item"><a href="./contact.html" class="nav-link">Contact</a></li>
            <li class="nav-item"><a href="./cart.html" class="nav-link active">Cart 🛒 (<span id="cart-count">0</span>)</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Cart Section -->
  <section id="cart" class="container py-5 mt-5">
    <h2 class="text-center mb-4 fw-bold text-dark">🛍️ Your Cart</h2>
    <div id="cart-items" class="mb-4"></div>
    
    <div class="cart-summary mt-4 p-4 border rounded shadow-sm bg-light">
      <h3 class="mb-4 text-center text-dark">🧾 Bill Summary</h3>
      
      <p class="d-flex justify-content-between fs-5">
          <span>Subtotal:</span>
          <strong>₹<span id="total-price">0</span></strong>
      </p>

      <p class="d-flex justify-content-between text-muted fs-5">
          <span>GST (5%):</span>
          <strong>₹<span id="gst-amount">0</span></strong>
      </p>
      
      <hr>

      <h4 class="d-flex justify-content-between mt-3 fw-bold text-dark">
          <span>Grand Total:</span>
          <strong>₹<span id="grand-total">0</span></strong>
      </h4>

      <div class="d-flex flex-column flex-md-row gap-3 mt-4">
        <button id="clear-cart" class="btn btn-outline-danger w-100 py-2 fw-bold">Clear Cart</button>
        <button id="finalize-booking" class="btn btn-success w-100 py-2 fw-bold">Finalize Booking</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 SS Restaurant | Follow us on 
      <a href="#" class="text-info">Instagram</a> & 
      <a href="#" class="text-info">Facebook</a></p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
